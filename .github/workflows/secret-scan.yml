name: security-checks

on:
  push:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Same single entry point as the pre-commit hook (`pnpm security`), so a
      # commit from a machine without the hook installed is still caught here.
      - run: node scripts/security.mjs --ci
